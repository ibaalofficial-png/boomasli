<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>iBaal Premium</title>

<!-- Google Fonts untuk Font Premium -->
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#030712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --theme-primary: #00f3ff;
    --theme-secondary: #ff2a85;
  }

  .app {
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    min-height: 100vh !important;
    padding-top: env(safe-area-inset-top, 6px) !important;
    padding-bottom: env(safe-area-inset-bottom, 8px) !important;
    box-sizing: border-box !important;
  }

  /* Panel Utama & Equalizer tanpa border luar, fokus ke glow menu item */
  .glass, .player, .equalizer {
    border: none !important;
    box-shadow: none !important;
  }

  .media-row { flex-shrink: 0 !important; }
  .controls-wrapper { flex-shrink: 0 !important; }
  .background { background: #030712 !important; transition: filter 0.5s ease; }
  
  /* Font Khusus untuk Judul iBaal Premium */
  .marquee-text {
    font-family: 'Syncopate', sans-serif !important;
    font-weight: 700 !important;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--theme-primary), var(--theme-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Kontainer Teks Berjalan untuk Judul Lagu di Bawah Import */
  .info-song-middle {
    overflow: hidden !important;
    width: 86% !important;
    max-width: 290px !important;
    margin: 4px auto 2px auto !important;
    text-align: center !important;
    white-space: nowrap !important;
  }

  #title {
    display: inline-block !important;
    white-space: nowrap !important;
    animation: titleScrollMarquee 7s ease-in-out infinite alternate !important;
    font-family: 'Orbitron', sans-serif !important;
    font-size: 13px !important;
    cursor: default;
    user-select: none;
  }

  @keyframes titleScrollMarquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-40%); }
  }
  
  /* Efek Border Glow pada Menu List, Tombol, dan Dropdown */
  .playlist-bar {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 5px !important;
    padding: 6px !important;
    overflow-x: visible !important;
    white-space: normal !important;
  }
  
  .playlist-bar .action-chip, 
  .playlist-bar select, 
  .playlist-bar label.custom-file-btn {
    font-size: 10px !important;
    padding: 4px 8px !important;
    height: 28px !important;
    border-radius: 6px !important;
    flex-shrink: 1 !important;
    background: rgba(3, 7, 18, 0.85) !important;
    border: 1px solid var(--theme-primary) !important;
    box-shadow: 0 0 8px rgba(0, 243, 255, 0.35) !important;
    color: var(--theme-primary) !important;
    transition: all 0.3s ease;
  }

  .playlist-bar .action-chip:hover, 
  .playlist-bar select:hover, 
  .playlist-bar label.custom-file-btn:hover {
    box-shadow: 0 0 14px var(--theme-primary) !important;
  }

  /* Kotak Playlist Diperbesar agar muat 5 lagu */
  .playlist-box {
    max-height: 145px !important;
    min-height: 120px !important;
    overflow-y: auto !important;
  }

  /* Equalizer & Preset Button Disamakan Lebarnya & Didorong ke Bawah */
  .equalizer {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    gap: 4px !important;
    padding: 4px 0 0 0 !important;
    margin-top: auto !important;
  }

  .preset {
    display: flex !important;
    width: 88% !important;
    max-width: 310px !important;
    gap: 4px !important;
    margin: 0 auto !important;
  }

  .preset button {
    flex: 1 !important;
    height: 28px !important;
    font-size: 10px !important;
    border-radius: 6px !important;
    border: 1px solid var(--theme-primary) !important;
    box-shadow: 0 0 8px rgba(0, 243, 255, 0.3) !important;
    background: rgba(3, 7, 18, 0.85) !important;
    color: var(--theme-primary) !important;
    cursor: pointer;
  }

  /* Dropdown Pilih Lua dirapatkan tanpa space berlebih */
  .custom-eq-dropdown {
    width: 88% !important;
    max-width: 310px !important;
    margin: 2px auto 2px auto !important;
  }

  .custom-eq-dropdown select {
    width: 100% !important;
    height: 28px !important;
    font-size: 10px !important;
    border-radius: 6px !important;
    border: 1px solid var(--theme-primary) !important;
    box-shadow: 0 0 8px rgba(0, 243, 255, 0.3) !important;
    background: rgba(3, 7, 18, 0.85) !important;
    color: var(--theme-primary) !important;
    text-align-last: center;
  }

  /* BPM Dashboard ditarik paling atas pas dengan notch */
  #bpmDashboardHUD {
    position: absolute;
    top: 4px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(3, 7, 18, 0.9);
    border: 1px solid var(--theme-primary);
    padding: 3px 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 9px;
    color: var(--theme-primary);
    z-index: 10;
    pointer-events: none;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.25);
  }
  #bpmDashboardHUD .energy-meter-bar {
    width: 50px;
    height: 5px;
    background: #111;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--theme-secondary);
  }
  #bpmDashboardHUD .energy-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--theme-primary), var(--theme-secondary));
    transition: width 0.1s ease-out;
  }

  /* Artwork Diperbesar & Posisi Diturunkan */
  .artwork-container-wrapper {
    position: relative;
    width: 170px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 18px auto 4px auto !important;
    flex-shrink: 0;
  }
  #visualizer {
    position: absolute;
    inset: -22px;
    width: 214px;
    height: 214px;
    pointer-events: none;
  }
  .album {
    width: 135px;
    height: 135px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--theme-primary);
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
    display: block;
    position: relative;
    z-index: 2;
  }
  .album img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>

<body>

<div class="background"></div>

<!-- Modal Onboarding Nama Pengguna -->
<div id="nameModal" class="modal-overlay" style="display:none; z-index:99999;">
  <div class="modal-content glass" style="text-align:center;">
    <h3 style="font-size:14px; margin-bottom:8px; color:var(--theme-primary);">🎧 iBaal Premium</h3>
    <p style="font-size:10px; margin-bottom:10px; opacity:0.8;">Masukkan nama panggilan kamu:</p>
    <input type="text" id="userNameInput" placeholder="Contoh: Ibal" style="width:100%; height:34px; padding:0 10px; background:#000; border:1px solid var(--theme-primary); border-radius:8px; color:#fff; font-size:12px; margin-bottom:12px; outline:none; text-align:center; box-shadow:0 0 8px rgba(0,243,255,0.3);">
    <div style="display:flex; gap:6px;">
      <button id="savePermanentBtn" style="flex:1; height:32px; background:var(--theme-primary); border:none; color:#000; border-radius:8px; font-size:10px; font-weight:bold; cursor:pointer; box-shadow:0 0 10px var(--theme-primary);">Simpan Permanen 💾</button>
      <button id="saveSessionBtn" style="flex:1; height:32px; background:#111; border:1px solid var(--theme-primary); color:#fff; border-radius:8px; font-size:10px; cursor:pointer;">Tanya Tiap Buka 🔄</button>
    </div>
  </div>
</div>

<!-- Modal ID3 Meta Inspector -->
<div id="id3Modal" class="modal-overlay" style="display:none; z-index:99999;">
  <div class="modal-content glass" style="text-align:left; max-width:320px;">
    <h3 style="font-size:12px; margin-bottom:6px; color:var(--theme-primary);">🎛️ ID3 Meta Inspector</h3>
    <div id="id3DetailsContent" style="font-size:10px; font-family:monospace; color:#ccc; line-height:1.5; max-height:200px; overflow-y:auto; margin-bottom:10px; background:rgba(0,0,0,0.5); padding:8px; border-radius:6px; border:1px solid var(--theme-primary); box-shadow:0 0 8px rgba(0,243,255,0.2);">
      Belum ada metadata lagu yang dimuat.
    </div>
    <button id="closeId3Modal" style="width:100%; height:28px; background:#0a0a0a; border:1px solid var(--theme-primary); color:#fff; border-radius:6px; font-size:10px; cursor:pointer;">Tutup</button>
  </div>
</div>

<div id="linkModal" class="modal-overlay">
  <div class="modal-content glass">
    <h3 style="font-size:12px; margin-bottom:6px; color:var(--theme-primary);">🌐 Tambah Link MP3</h3>
    <input type="text" id="arcTitle" placeholder="Judul Lagu..." style="width:100%; height:30px; padding:0 8px; background:#000; border:1px solid var(--theme-primary); border-radius:8px; color:#fff; font-size:11px; margin-bottom:8px; outline:none; box-shadow:0 0 6px rgba(0,243,255,0.2);">
    <input type="text" id="arcUrl" placeholder="https://... (Paste Direct Link)" style="width:100%; height:30px; padding:0 8px; background:#000; border:1px solid var(--theme-primary); border-radius:8px; color:#fff; font-size:11px; margin-bottom:10px; outline:none; box-shadow:0 0 6px rgba(0,243,255,0.2);">
    <div style="display:flex; gap:6px;">
      <button id="closeLinkModal" style="flex:1; height:30px; background:#0a0a0a; border:1px solid var(--theme-primary); color:#fff; border-radius:8px; font-size:11px; cursor:pointer;">Batal</button>
      <button id="saveLinkSong" style="flex:1; height:30px; background:var(--theme-primary); border:none; color:#000; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer; box-shadow:0 0 10px var(--theme-primary);">Simpan</button>
    </div>
  </div>
</div>

<main class="app" id="appMainContainer">
  <section class="player glass" style="overflow: visible !important;">
    <div id="bpmDashboardHUD">
      <div>BPM: <span id="hudBpmValue">128</span></div>
      <div>ENERGY: <span id="hudEnergyText">LOW</span></div>
      <div class="energy-meter-bar"><div class="energy-fill" id="hudEnergyFill"></div></div>
    </div>

    <div class="header-inline" style="margin-top: 18px;">
      <div class="marquee-container">
        <h1 class="marquee-text" style="font-size:11px;">iBaal Premium <span style="font-size:9px; color:var(--theme-primary);">@meugom</span></h1>
      </div>
      <button id="menu">☰</button>
    </div>

    <!-- Artwork & Visualizer Terpusat -->
    <div class="artwork-container-wrapper" id="portalVisualizerTeardown">
      <canvas id="visualizer"></canvas>
      <label for="customArtFileInput" class="album" id="albumContainer" title="Ketuk untuk ganti Artwork">
        <img id="cover" src="" alt="Cover">
      </label>
    </div>
    <input type="file" id="customArtFileInput" style="display:none;" accept="image/*">

    <!-- Hanya Teks "i Baal e Qe" Tetap di Atas -->
    <div class="info-song" style="overflow:hidden; width:86%; max-width:290px; margin:4px auto 2px auto; text-align:center; white-space:nowrap;">
      <p id="artist">
        <span class="bounce-letter">"</span><span class="bounce-letter">i</span><span class="bounce-letter">&nbsp;</span><span class="bounce-letter">B</span><span class="bounce-letter">a</span><span class="bounce-letter">a</span><span class="bounce-letter">L</span><span class="bounce-letter">&nbsp;</span><span class="bounce-letter">&nbsp;</span><span class="bounce-letter">e</span><span class="bounce-letter">&nbsp;</span><span class="bounce-letter">Q</span><span class="bounce-letter">e</span><span class="bounce-letter">"</span>
      </p>
    </div>

    <div class="progress" style="margin-top: 6px;">
      <span id="current">0:00</span>
      <input type="range" id="progress" value="0" min="0" max="100" step="0.1">
      <span id="duration">0:00</span>
    </div>

    <!-- Playlist Bar (Termasuk Tombol Import) -->
    <div class="playlist-bar">
      <button id="aiToggleBtn" class="action-chip" title="Toggle AI Voice">🤖 AI: ON</button>
      <select id="playlistDropdown">
        <option value="Mix / Campuran">🔒 Mix / Campuran</option>
        <option value="VIP">👑 VIP</option>
        <option value="Dangdut">🔥 Dangdut</option>
        <option value="DJ Indonesia">🎧 DJ Indonesia</option>
        <option value="Hiphop">🎤 Hiphop</option>
        <option value="Lagu Jawa">🪕 Lagu Jawa</option>
      </select>
      <button id="bassBoostBtn" class="action-chip" title="Heavy Bass">🔥 Bass</button>
      <button id="spatial8DBtn" class="action-chip" title="True 8D Spatial Audio">🌀 8D</button>
      <button id="id3InfoBtn" class="action-chip" title="Inspect ID3 Tags">ℹ️ ID3</button>
      
      <!-- Visualizer Style Dropdown -->
      <select id="visualStyleDropdown" class="action-chip" title="Visualizer Style">
        <option value="color_spikes">🌈 Color Spikes</option>
        <option value="pulsating_circles">⭕ Pulsating Circles</option>
        <option value="elliptical_cage">🪐 Elliptical Cage</option>
        <option value="scattered_particles">✨ Scattered Particles</option>
        <option value="waveform">📈 Waveform</option>
        <option value="spiral">🌀 Spiral</option>
        <option value="frequency_spectrum">📊 Frequency Spectrum</option>
        <option value="single_wave">〰️ Single Wave</option>
        <option value="circles">🔵 Circles</option>
        <option value="default">⭐ Default</option>
        <option value="off">❌ Off</option>
      </select>

      <!-- Dynamic Neon Theme Dropdown -->
      <select id="themeDropdown" class="action-chip" title="Dynamic Theme Engine">
        <option value="cyan">🌌 Cyber Cyan</option>
        <option value="green">🔋 Acid Green</option>
        <option value="orange">🔥 Sunset Orange</option>
        <option value="red">🩸 Blood Red</option>
        <option value="purple">🔮 Royal Purple</option>
      </select>

      <!-- Ray-Traced Acoustic Venue Simulator Selector -->
      <select id="venueDropdown" class="action-chip" title="Acoustic Venue Simulator">
        <option value="studio">🎧 Studio Dry</option>
        <option value="club">🌃 Cyber Club</option>
        <option value="cathedral">⛪ Cathedral</option>
        <option value="stadium">🏟️ Stadium</option>
      </select>

      <button id="openLinkModal" class="action-chip">+ Link</button>
      <button id="backupBtn" class="action-chip" style="display:none; color:#ffcc00;">💾</button>
      <input type="file" id="restoreInput" style="display:none;" accept=".json">
      <label for="restoreInput" id="restoreLabel" class="action-chip" style="display:none; color:#00ff66; cursor:pointer;">📂</label>
      <label for="localFileInput" class="custom-file-btn" style="cursor:pointer;">📁 Import</label>
      <input type="file" id="localFileInput" style="display:none;" multiple accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac">
    </div>

    <!-- Judul Lagu Berjalan Tepat di Bawah Import -->
    <div class="info-song-middle">
      <h2 id="title">No Song</h2>
    </div>

    <!-- Tombol Kontrol (Shuffle, Prev, Play, Next) -->
    <div class="controls-wrapper" style="margin-top: 4px; margin-bottom: 4px;">
      <div class="media-row">
        <button id="shuffleBtn" title="Shuffle">🔀</button>
        <button id="prevBtn">Prev</button>
        <button id="playBtn">Play</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>

    <!-- Kotak Playlist (Muat 5 Lagu Sekaligus) -->
    <div class="playlist-box" id="playlistBox">
      <div id="playlistList" style="text-align:center; padding:6px; font-size:9px; opacity:.7;">Memuat data...</div>
    </div>
  </section>

  <!-- Bagian Equalizer Dikunci di Paling Bawah Tanpa Space Kosong -->
  <section class="equalizer glass">
    <div class="preset">
      <button data-preset="flat">Flat</button>
      <button data-preset="bass">Bass</button>
      <button data-preset="vocal">Vocal</button>
      <button data-preset="rock">Rock</button>
      <button data-preset="edm">EDM</button>
    </div>
    <div class="custom-eq-dropdown">
      <select id="customEqSelect">
        <option value="" disabled selected>🎛️ Pilih Preset .lua</option>
        <option value="airpods_edit">Airpods Edit</option>
        <option value="airpods_edit2">Airpods Edit 2</option>
        <option value="bass_enak">Bass Enak</option>
        <option value="bass2">Bass 2</option>
        <option value="basssss">Basssss</option>
        <option value="current_bands">Current Bands</option>
        <option value="pubg_bass">PUBG Bass</option>
        <option value="pubg_bass2">PUBG Bass 2</option>
        <option value="pubg_bassss">PUBG Bassss</option>
        <option value="pubg">PUBG Original</option>
      </select>
    </div>
  </section>
</main>

<audio id="audio" crossorigin="anonymous" playsinline webkit-playsinline preload="auto"></audio>

<script src="js/equalizer.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const audio = document.getElementById("audio");
  const playBtn = document.getElementById("playBtn");
  const progressInput = document.getElementById("progress");
  const currentTimeSpan = document.getElementById("current");
  const durationSpan = document.getElementById("duration");
  const playlistDropdown = document.getElementById("playlistDropdown");
  const linkModal = document.getElementById("linkModal");
  const openLinkModal = document.getElementById("openLinkModal");
  const closeLinkModal = document.getElementById("closeLinkModal");
  const saveLinkSong = document.getElementById("saveLinkSong");
  const arcTitleInput = document.getElementById("arcTitle");
  const arcUrlInput = document.getElementById("arcUrl");
  const localFileInput = document.getElementById("localFileInput");
  const coverImg = document.getElementById("cover");
  const customEqSelect = document.getElementById("customEqSelect");
  const presetBtns = document.querySelectorAll(".preset button");
  const customArtFileInput = document.getElementById("customArtFileInput");
  const backupBtn = document.getElementById("backupBtn");
  const restoreLabel = document.getElementById("restoreLabel");
  const restoreInput = document.getElementById("restoreInput");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const albumContainer = document.getElementById("albumContainer");
  const bassBoostBtn = document.getElementById("bassBoostBtn");
  const spatial8DBtn = document.getElementById("spatial8DBtn");
  const aiToggleBtn = document.getElementById("aiToggleBtn");
  const id3InfoBtn = document.getElementById("id3InfoBtn");
  const id3Modal = document.getElementById("id3Modal");
  const closeId3Modal = document.getElementById("closeId3Modal");
  const id3DetailsContent = document.getElementById("id3DetailsContent");
  const themeDropdown = document.getElementById("themeDropdown");
  const venueDropdown = document.getElementById("venueDropdown");
  const visualStyleDropdown = document.getElementById("visualStyleDropdown");
  const songTitleEl = document.getElementById("title");
  
  const hudBpmValue = document.getElementById("hudBpmValue");
  const hudEnergyText = document.getElementById("hudEnergyText");
  const hudEnergyFill = document.getElementById("hudEnergyFill");

  const visualCanvas = document.getElementById("visualizer");
  const vCtx = visualCanvas ? visualCanvas.getContext("2d") : null;

  let isShuffled = false;
  let isBassBoostActive = false;
  let is8DActive = false;
  let isAiVoiceActive = true; 
  let currentVisualStyle = "color_spikes"; 
  let customAudioCtx = null;
  let customStereoPanner = null;
  let customSpatialFilter = null;
  let customGainNode = null;
  let panInterval = null;
  let isUserSeeking = false;
  
  let currentPlayingSongTitle = "";
  let currentSongId3Meta = null;

  let scene, camera, renderer, galaxyParticles, galaxyGeometry, weatherMesh;
  let boothGroup, crowdGroup, genesisTerrainMesh, chladniSculptorMesh;

  const neonThemes = {
    cyan: { primary: '#00f3ff', secondary: '#ff2a85', cloth: 0x00f3ff },
    green: { primary: '#00ff66', secondary: '#ccff00', cloth: 0x00ff66 },
    orange: { primary: '#ff5500', secondary: '#ffcc00', cloth: 0xff5500 },
    red: { primary: '#ff0033', secondary: '#ff6600', cloth: 0xff0033 },
    purple: { primary: '#bf00ff', secondary: '#00f3ff', cloth: 0xbf00ff }
  };

  function applyTheme(themeKey, isAuto = false) {
    const theme = neonThemes[themeKey] || neonThemes.cyan;
    document.documentElement.style.setProperty('--theme-primary', theme.primary);
    document.documentElement.style.setProperty('--theme-secondary', theme.secondary);
    if (themeDropdown && !isAuto) themeDropdown.value = themeKey;

    if (weatherMesh && weatherMesh.material) {
      weatherMesh.material.color.setHex(theme.cloth);
    }

    if (galaxyGeometry) {
      const colors = galaxyGeometry.attributes.color;
      const cPrimary = new THREE.Color(theme.primary);
      const cSecondary = new THREE.Color(theme.secondary);
      for (let i = 0; i < colors.count; i++) {
        const mixed = cPrimary.clone();
        if (i % 2 === 0) mixed.lerp(cSecondary, Math.random());
        colors.setXYZ(i, mixed.r, mixed.g, mixed.b);
      }
      colors.needsUpdate = true;
    }
  }

  function initRealWorldWeatherTimeSync() {
    const hour = new Date().getHours();
    let matchedTheme = "cyan";

    if (hour >= 5 && hour < 11) {
      matchedTheme = "cyan";
    } else if (hour >= 11 && hour < 15) {
      matchedTheme = "green";
    } else if (hour >= 15 && hour < 19) {
      matchedTheme = "orange";
    } else if (hour >= 19 && hour < 23) {
      matchedTheme = "purple";
    } else {
      matchedTheme = "red";
    }

    applyTheme(matchedTheme, true);
  }

  themeDropdown.addEventListener("change", (e) => {
    applyTheme(e.target.value);
  });

  visualStyleDropdown.addEventListener("change", (e) => {
    currentVisualStyle = e.target.value;
    if (visualCanvas) {
      visualCanvas.style.display = (currentVisualStyle === "off") ? "none" : "block";
    }
  });

  let userName = localStorage.getItem("iBaal_User_Name") || sessionStorage.getItem("iBaal_User_Name");
  const nameModal = document.getElementById("nameModal");
  const userNameInput = document.getElementById("userNameInput");
  const savePermanentBtn = document.getElementById("savePermanentBtn");
  const saveSessionBtn = document.getElementById("saveSessionBtn");

  if (!userName) {
    if (nameModal) nameModal.style.display = "flex";
  }

  if (savePermanentBtn) {
    savePermanentBtn.addEventListener("click", () => {
      const val = userNameInput.value.trim();
      if (!val) { alert("Nama wajib diisi dulu bosku!"); return; }

  function initUnifiedAudioPipeline() {
    if (customAudioCtx) return;
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      customAudioCtx = new AudioContextClass();
      const customSourceNode = customAudioCtx.createMediaElementSource(audio);
      
      const customBassFilter = customAudioCtx.createBiquadFilter();
      customBassFilter.type = 'lowshelf';
      customBassFilter.frequency.value = 180;
      customBassFilter.gain.value = 0;

      const autoCompressor = customAudioCtx.createDynamicsCompressor();
      autoCompressor.threshold.value = -18;
      autoCompressor.knee.value = 30;
      autoCompressor.ratio.value = 12;
      autoCompressor.attack.value = 0.003;
      autoCompressor.release.value = 0.25;

      if (customAudioCtx.createStereoPanner) {
        customStereoPanner = customAudioCtx.createStereoPanner();
        customStereoPanner.pan.value = 0;
      }

      customSpatialFilter = customAudioCtx.createBiquadFilter();
      customSpatialFilter.type = 'lowpass';
      customSpatialFilter.frequency.value = 20000;

      customGainNode = customAudioCtx.createGain();
      customGainNode.gain.value = 1.0;

      customSourceNode.connect(customBassFilter);
      customBassFilter.connect(autoCompressor);
      autoCompressor.connect(customSpatialFilter);
      customSpatialFilter.connect(customGainNode);

      if (customStereoPanner) {
        customGainNode.connect(customStereoPanner);
        Equalizer.init(customAudioCtx, customStereoPanner);
      } else {
        Equalizer.init(customAudioCtx, customGainNode);
      }
    } catch (e) {
      console.error("Unified Pipeline Error:", e);
    }
  }

  async function triggerAudioContext() {
    initUnifiedAudioPipeline();
    if (customAudioCtx && customAudioCtx.state === "suspended") {
      await customAudioCtx.resume();
    }
    if (typeof Equalizer !== "undefined" && Equalizer.context && Equalizer.context.state === "suspended") {

  }

  function applyDjFilterSweep() {

    try {

  }

  function setupMediaSession() {
    if (!("mediaSession" in navigator)) return;
    
    const actions = [
      ['play', async () => {
        await triggerAudioContext();
        await audio.play();
        playBtn.innerText = "Pause";
        navigator.mediaSession.playbackState = "playing";
      }],
      ['pause', () => {
        audio.pause();
        playBtn.innerText = "Play";
        navigator.mediaSession.playbackState = "paused";
      }],
      ['nexttrack', async () => {
        await triggerAudioContext();
        handleNextTrack();
      }],
      ['previoustrack', async () => {
        await triggerAudioContext();
        const activeList = playlists[currentPlaylistKey] || [];
        if (activeList.length > 0) smoothCrossfadePlay(currentTrackIndex - 1);
      }],
      ['seekto', (details) => {
        if (details.seekTime !== undefined && Number.isFinite(details.seekTime) && audio.duration) {
          audio.currentTime = details.seekTime;
          progressInput.value = (audio.currentTime / audio.duration) * 100;
        }
      }]
    ];

    actions.forEach(([action, handler]) => {
      try {
        navigator.mediaSession.setActionHandler(action, handler);
      } catch (e) {}
    });
  }
  setupMediaSession();

  openLinkModal.addEventListener("click", () => { linkModal.style.display = "flex"; arcTitleInput.value = ""; arcUrlInput.value = ""; });
  closeLinkModal.addEventListener("click", () => { linkModal.style.display = "none"; });

  saveLinkSong.addEventListener("click", () => {
    const title = arcTitleInput.value.trim();
    let url = arcUrlInput.value.trim().replace(/…/g, "").replace(/\s+/g, "");
    if (!title || !url) { alert("Judul dan URL wajib diisi!"); return; }
    const targetPlaylist = currentPlaylistKey.startsWith("VIP_") ? currentPlaylistKey : "VIP_1";
    if (!playlists[targetPlaylist]) playlists[targetPlaylist] = [];
    playlists[targetPlaylist].push({ 
      id: Date.now() + Math.random(), 
      title, 
      artist: 'iBaal eQe', 
      album: 'Direct Stream',
      cover: defaultHeadphoneCover, 
      url,
      id3: { title, artist: 'iBaal eQe', album: 'Direct Stream', year: '-', genre: 'Stream' }
    });
    saveToStorage();
    linkModal.style.display = "none";
    filterActivePlaylist();
    alert(`✅ Link berhasil disimpan!`);
  });

  localFileInput.addEventListener("change", e => {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    if (!playlists[currentPlaylistKey]) playlists[currentPlaylistKey] = [];
    Array.from(files).forEach(file => {
      const localBlobUrl = URL.createObjectURL(file);
      window.jsmediatags.read(file, {
        onSuccess: function(tag) {
          const t = tag.tags;
          const title = t.title || file.name.replace(/\.[^/.]+$/, "");
          const artist = t.artist || "iBaal eQe";
          const album = t.album || "Local Library";
          const year = t.year || t.date || "-";
          const genre = t.genre || "-";
          const comment = (t.comments && t.comments.text) ? t.comments.text : "-";
          const lyrics = (t.lyrics && t.lyrics.lyrics) ? t.lyrics.lyrics : null;
          const coverUrl = parsePictureToUrl(t.picture);

          const id3Data = { title, artist, album, year, genre, comment, lyrics };

          playlists[currentPlaylistKey].push({ 
            id: Date.now() + Math.random(), 
            title, 
            artist, 
            album, 
            cover: coverUrl, 
            url: localBlobUrl,
            id3: id3Data
          });
          renderPlaylistUI();
          if (!audio.src) { currentTrackIndex = playlists[currentPlaylistKey].length - 1; smoothCrossfadePlay(currentTrackIndex); }
        },
        onError: function() {
          const title = file.name.replace(/\.[^/.]+$/, "");
          playlists[currentPlaylistKey].push({ 
            id: Date.now() + Math.random(), 
            title, 
            artist: "iBaal eQe", 
            album: "Local", 
            cover: defaultHeadphoneCover, 
            url: localBlobUrl,
            id3: { title, artist: "iBaal eQe", album: "Local", year: "-", genre: "-" }
          });
          renderPlaylistUI();
          if (!audio.src) { currentTrackIndex = playlists[currentPlaylistKey].length - 1; smoothCrossfadePlay(currentTrackIndex); }
        }
      });
    });
    localFileInput.value = "";
  });

  function filterActivePlaylist() {
    if (!playlists[currentPlaylistKey]) playlists[currentPlaylistKey] = [];
    renderPlaylistUI();
    const activeList = playlists[currentPlaylistKey];
    if (activeList.length > 0 && !audio.src) { currentTrackIndex = 0; updatePlayerInfo(activeList[0]); }
  }

  function renderPlaylistUI() {
    const list = document.getElementById("playlistList");
    if (!list) return;
    list.innerHTML = "";
    const activeList = playlists[currentPlaylistKey] || [];
    if (activeList.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:6px;font-size:9px;opacity:.7;">Belum ada lagu.</div>';
      return;
    }
    activeList.forEach((song, index) => {
      const row = document.createElement("div");
      row.className = `song-row ${index === currentTrackIndex ? "active" : ""}`;
      const titleSpan = document.createElement("span");
      titleSpan.className = "song-title-text";
      titleSpan.innerText = `${index + 1}. ${song.title}`;
      titleSpan.onclick = () => smoothCrossfadePlay(index);
      row.appendChild(titleSpan);

      const deleteBtn = document.createElement("button");
      deleteBtn.innerText = "❌";
      deleteBtn.style.background = "transparent"; deleteBtn.style.border = "none"; deleteBtn.style.cursor = "pointer"; deleteBtn.style.fontSize = "9px"; deleteBtn.style.padding = "0 4px";
      deleteBtn.onclick = e => {
        e.stopPropagation();
        if (confirm(`Hapus lagu "${song.title}"?`)) {
          playlists[currentPlaylistKey].splice(index, 1);
          if (currentTrackIndex >= playlists[currentPlaylistKey].length) {
            currentTrackIndex = Math.max(0, playlists[currentPlaylistKey].length - 1);
          }
          saveToStorage(); renderPlaylistUI();
        }
      };
      row.appendChild(deleteBtn);
      list.appendChild(row);
    });
  }

  function updatePlayerInfo(song) {
    document.getElementById("title").innerText = song.title;
    currentPlayingSongTitle = song.title;
    currentSongId3Meta = song.id3 || null;
    if (coverImg) coverImg.src = song.cover || defaultHeadphoneCover;
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title || "Unknown Track",
          artist: song.artist || "iBaal eQe",
          album: song.album || "iBaal Premium",
          artwork: [
            { src: song.cover || defaultHeadphoneCover, sizes: "96x96", type: "image/png" },
            { src: song.cover || defaultHeadphoneCover, sizes: "512x512", type: "image/png" }
          ]
        });
        navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
      } catch (e) {}
    }
  }

  function handleNextTrack() {
    const activeList = playlists[currentPlaylistKey] || [];
    if (activeList.length === 0) return;
    if (isShuffled) {
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * activeList.length);
      } while (randomIndex === currentTrackIndex && activeList.length > 1);
      smoothCrossfadePlay(randomIndex);
    } else {
      smoothCrossfadePlay(currentTrackIndex + 1);
    }
  }

  playBtn.addEventListener("click", async () => {
    const activeList = playlists[currentPlaylistKey] || [];
    if (activeList.length === 0) { alert("Playlist kosong!"); return; }
    try {
      await triggerAudioContext();
      if (audio.paused) {
        if (!audio.src) await smoothCrossfadePlay(currentTrackIndex);
        else { 
          await audio.play(); 
          playBtn.innerText = "Pause"; 
        }
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
      } else {
        audio.pause(); 
        playBtn.innerText = "Play";
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
      }
    } catch (err) { playBtn.innerText = "Play"; }
  });

  document.getElementById("nextBtn").addEventListener("pointerdown", async (e) => {
    e.preventDefault();
    await triggerAudioContext();
    handleNextTrack();
  });

  document.getElementById("prevBtn").addEventListener("pointerdown", async (e) => {
    e.preventDefault();
    await triggerAudioContext();
    const activeList = playlists[currentPlaylistKey] || [];
    if (activeList.length > 0) smoothCrossfadePlay(currentTrackIndex - 1);
  });

  audio.addEventListener("ended", () => { handleNextTrack(); });

  audio.addEventListener("play", () => {
    playBtn.innerText = "Pause";
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  });
  
  audio.addEventListener("pause", () => {
    if (!isChangingTrack) playBtn.innerText = "Play";
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  });

  progressInput.addEventListener("mousedown", () => { isUserSeeking = true; });
  progressInput.addEventListener("touchstart", () => { isUserSeeking = true; });

  progressInput.addEventListener("input", e => {
    if (audio.duration && Number.isFinite(audio.duration)) {
      const seekTime = (Number(e.target.value) / 100) * audio.duration;
      currentTimeSpan.innerText = formatTime(seekTime);
    }
  });

  progressInput.addEventListener("change", e => {
    if (audio.duration && Number.isFinite(audio.duration)) {
      const seekTime = (Number(e.target.value) / 100) * audio.duration;
      audio.currentTime = seekTime;
    }
    isUserSeeking = false;
  });

  audio.addEventListener("timeupdate", () => {
    if (!isUserSeeking && audio.duration && Number.isFinite(audio.duration)) {
      progressInput.value = (audio.currentTime / audio.duration) * 100;
      currentTimeSpan.innerText = formatTime(audio.currentTime);
      durationSpan.innerText = formatTime(audio.duration);
    }
  });

  function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${minutes}:${secs < 10 ? "0" : ""}${secs}`;
  }

  // --- RENDER VISUALIZER STYLES ---
  function syncArtworkToBeat() {
    requestAnimationFrame(syncArtworkToBeat);
    
    if (visualCanvas) {
      if (visualCanvas.width !== visualCanvas.offsetWidth || visualCanvas.height !== visualCanvas.offsetHeight) {
        visualCanvas.width = visualCanvas.offsetWidth;
        visualCanvas.height = visualCanvas.offsetHeight;
      }
      vCtx.clearRect(0, 0, visualCanvas.width, visualCanvas.height);
    }

    const analyser = (typeof Equalizer !== "undefined" && Equalizer.analyser) ? Equalizer.analyser : null;

    if (analyser && !audio.paused && currentVisualStyle !== "off") {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);
      
      let sum = 0;
      for (let i = 0; i < 20; i++) { sum += dataArray[i]; }
      let bassValue = sum / 20;

      let calculatedBpm = Math.floor(115 + (bassValue / 255) * 35);
      if (hudBpmValue) hudBpmValue.innerText = calculatedBpm;

      let energyPercent = Math.min(100, Math.floor((bassValue / 255) * 100));
      if (hudEnergyFill) hudEnergyFill.style.width = energyPercent + "%";
      if (hudEnergyText) {
        if (energyPercent > 75) hudEnergyText.innerText = "MAX 🔥";
        else if (energyPercent > 40) hudEnergyText.innerText = "HIGH";
        else hudEnergyText.innerText = "MID";
      }

      let scale = 1 + (bassValue / 255) * 0.22; 
      let hue = (Date.now() / 2) % 360; 
      
      if (albumContainer) {
        albumContainer.style.transform = `translate3d(0,0,0) scale(${scale})`;
        albumContainer.style.borderColor = `hsl(${hue}, 100%, 60%)`;
        albumContainer.style.boxShadow = `0 0 ${15 + bassValue * 0.4}px hsl(${hue}, 100%, 60%)`;
      }

      if (vCtx && visualCanvas) {
        const cw = visualCanvas.width;
        const ch = visualCanvas.height;
        const centerX = cw / 2;
        const centerY = ch / 2;
        const baseRadius = 74;

        vCtx.save();
        vCtx.translate(centerX, centerY);

        if (currentVisualStyle === "color_spikes" || currentVisualStyle === "default") {
          const bars = 52;
          const angleStep = (Math.PI * 2) / bars;
          for (let i = 0; i < bars; i++) {
            const val = dataArray[i % bufferLength] / 255;
            const barHeight = val * 28 + 4;
            const currentHue = (hue + i * 6) % 360;

            vCtx.rotate(angleStep);
            vCtx.fillStyle = `hsl(${currentHue}, 100%, 60%)`;
            vCtx.fillRect(baseRadius, -1.5, barHeight, 3);
          }
        } else if (currentVisualStyle === "pulsating_circles") {
          for (let c = 1; c <= 3; c++) {
            let radius = baseRadius + (c * 10) + (bassValue * 0.15 * c);
            vCtx.beginPath();
            vCtx.arc(0, 0, radius, 0, Math.PI * 2);
            vCtx.strokeStyle = `hsla(${(hue + c * 40) % 360}, 100%, 60%, ${0.7 - c * 0.15})`;
            vCtx.lineWidth = 2;
            vCtx.stroke();
          }
        } else if (currentVisualStyle === "elliptical_cage") {
          vCtx.rotate(Date.now() * 0.001);
          for (let i = 0; i < 4; i++) {
            vCtx.beginPath();
            vCtx.ellipse(0, 0, baseRadius * 0.95, baseRadius * 0.45 + (bassValue * 0.08), (i * Math.PI) / 4, 0, Math.PI * 2);
            vCtx.strokeStyle = `hsl(${(hue + i * 40) % 360}, 100%, 60%)`;
            vCtx.lineWidth = 2;
            vCtx.stroke();
          }
        } else if (currentVisualStyle === "waveform" || currentVisualStyle === "single_wave") {
          vCtx.beginPath();
          vCtx.moveTo(-baseRadius, 0);
          for (let x = -baseRadius; x < baseRadius; x += 4) {
            let index = Math.floor(((x + baseRadius) / (baseRadius * 2)) * bufferLength);
            let y = ((dataArray[index] / 255) - 0.5) * 40;
            vCtx.lineTo(x, y);
          }
          vCtx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
          vCtx.lineWidth = 2;
          vCtx.stroke();
        } else if (currentVisualStyle === "spiral") {
          vCtx.rotate(Date.now() * 0.0008);
          vCtx.beginPath();
          let angle = 0;
          for (let i = 0; i < bufferLength; i += 4) {
            let r = (i / bufferLength) * baseRadius * (1 + bassValue / 350);
            let x = r * Math.cos(angle);
            let y = r * Math.sin(angle);
            if (i === 0) vCtx.moveTo(x, y);
            else vCtx.lineTo(x, y);
            angle += 0.2;
          }
          vCtx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
          vCtx.lineWidth = 2;
          vCtx.stroke();
        } else if (currentVisualStyle === "frequency_spectrum") {
          const barWidth = (baseRadius * 1.8) / 24;
          let xCoord = -baseRadius * 0.9;
          for (let i = 0; i < 24; i++) {
            let barH = (dataArray[i * 2] / 255) * 34;
            vCtx.fillStyle = `hsl(${(hue + i * 10) % 360}, 100%, 60%)`;
            vCtx.fillRect(xCoord, baseRadius * 0.7 - barH, barWidth - 1, barH);
            xCoord += barWidth;
          }
        } else if (currentVisualStyle === "scattered_particles") {
          for (let i = 0; i < 30; i++) {
            let angle = Math.random() * Math.PI * 2;
            let dist = baseRadius + Math.random() * 15 + (bassValue * 0.12);
            let px = Math.cos(angle) * dist;
            let py = Math.sin(angle) * dist;
            vCtx.fillStyle = `hsl(${(hue + i * 12) % 360}, 100%, 60%)`;
            vCtx.fillRect(px, py, 2.5, 2.5);
          }
        } else if (currentVisualStyle === "circles") {
          vCtx.beginPath();
          vCtx.arc(0, 0, baseRadius + (bassValue * 0.2), 0, Math.PI * 2);
          vCtx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
          vCtx.lineWidth = 2.5;
          vCtx.stroke();
        }
        vCtx.restore();
      }
    } else {
      if (albumContainer) {
        albumContainer.style.transform = "translate3d(0,0,0) scale(1)";
        albumContainer.style.borderColor = "var(--theme-primary)";
        albumContainer.style.boxShadow = "0 0 15px rgba(0, 243, 255, 0.6)";
      }
    }
  }
  syncArtworkToBeat();

  updateCloudButtonsVisibility();
  filterActivePlaylist();
});
</script>
</body>
</html>
