      - name: DEBUG IPA CONTENT
        run: |
          set -e

          echo "=== IPA SIZE ==="
          ls -lh BoomMusic.ipa

          echo ""
          echo "=== IPA FILE LIST ==="
          unzip -l BoomMusic.ipa

          echo ""
          echo "=== EXTRACT IPA ==="

          rm -rf debug-ipa
          mkdir debug-ipa

          unzip -q BoomMusic.ipa -d debug-ipa

          echo ""
          echo "=== APP SIZE ==="
          du -sh debug-ipa/Payload/BoomMusic.app

          echo ""
          echo "=== APP CONTENT ==="
          find debug-ipa/Payload/BoomMusic.app \
            -maxdepth 3 \
            -type f \
            -exec ls -lh {} \;

          echo ""
          echo "=== WEB CONTENT ==="

          if [ -d "debug-ipa/Payload/BoomMusic.app/www" ]; then
              find debug-ipa/Payload/BoomMusic.app/www \
                -type f \
                -exec ls -lh {} \;
          else
              echo "WWW TIDAK ADA"
          fi
