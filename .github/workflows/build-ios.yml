name: Build Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Verify Source
        run: |
          set -e

          test -f BoomMusic/AppDelegate.swift
          test -f BoomMusic/SceneDelegate.swift
          test -f BoomMusic/ViewController.swift
          test -f BoomMusic/AudioManager.swift
          test -f BoomMusic/Info.plist

          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js
          test -f BoomMusic/www/Equalizer.js
          test -f BoomMusic/www/Visualizer.js

          echo "Source OK"

      - name: Create XcodeGen Project
        run: |
          mkdir -p Build

          cat > Build/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              PRODUCT_NAME: BoomMusic
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: ../BoomMusic/Info.plist
              GENERATE_INFOPLIST_FILE: NO

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: ../BoomMusic/AppDelegate.swift
                - path: ../BoomMusic/SceneDelegate.swift
                - path: ../BoomMusic/ViewController.swift
                - path: ../BoomMusic/AudioManager.swift

              settings:
                base:
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

      - name: Generate Xcode Project
        working-directory: Build
        run: |
          xcodegen generate

      - name: Build Archive
        working-directory: Build
        run: |
          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/BoomMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Prepare App
        run: |
          set -e

          APP="BoomMusic.xcarchive/Products/Applications/BoomMusic.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: BoomMusic.app tidak ditemukan"
            exit 1
          fi

          echo "=== ORIGINAL APP ==="
          du -sh "$APP"

          echo "=== APP FILES ==="
          find "$APP" -maxdepth 2 -type f | sort

          echo "=== COPY WEB APP ==="

          rm -rf "$APP/www"
          mkdir -p "$APP/www"

          cp -R BoomMusic/www/. "$APP/www/"

          echo "=== WEB FILES ==="
          find "$APP/www" -type f | sort

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"
          test -f "$APP/www/Equalizer.js"
          test -f "$APP/www/Visualizer.js"

      - name: Create IPA
        run: |
          set -e

          rm -rf Payload BoomMusic.ipa
          mkdir -p Payload

          cp -R \
            "BoomMusic.xcarchive/Products/Applications/BoomMusic.app" \
            "Payload/BoomMusic.app"

          echo "=== FINAL APP SIZE ==="
          du -sh Payload/BoomMusic.app

          echo "=== FINAL APP CONTENT ==="
          find Payload/BoomMusic.app -maxdepth 2 -type f | sort

          echo "=== PACKAGING IPA ==="

          ditto -c -k --sequesterRsrc --keepParent \
            Payload/BoomMusic.app \
            BoomMusic.app.zip

          rm -f BoomMusic.ipa

          cd Payload
          zip -qry ../BoomMusic.ipa BoomMusic.app
          cd ..

          rm -f BoomMusic.app.zip

          echo "=== FINAL IPA ==="
          ls -lh BoomMusic.ipa

      - name: Verify IPA
        run: |
          set -e

          echo "=== IPA CONTENT ==="

          unzip -l BoomMusic.ipa

          echo "=== CHECK APP ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/BoomMusic"

          echo "=== CHECK INDEX ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/www/index.html"

          echo "=== CHECK PLAYER ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/www/Player.js"

          echo "=== CHECK EQUALIZER ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/www/Equalizer.js"

          echo "=== CHECK VISUALIZER ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/www/Visualizer.js"

          echo "IPA STRUCTURE OK"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
