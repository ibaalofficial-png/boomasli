name: Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Source
        run: |
          set -e

          test -f BoomMusic/AppDelegate.swift
          test -f BoomMusic/SceneDelegate.swift
          test -f BoomMusic/ViewController.swift
          test -f BoomMusic/AudioManager.swift

          test -f BoomMusic/Info.plist

          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js

          echo "SOURCE OK"

      - name: Create XcodeGen Project
        run: |
          cat > project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              PRODUCT_NAME: BoomMusic
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: BoomMusic/Info.plist
              GENERATE_INFOPLIST_FILE: NO

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: BoomMusic/AppDelegate.swift
                - path: BoomMusic/SceneDelegate.swift
                - path: BoomMusic/ViewController.swift
                - path: BoomMusic/AudioManager.swift

              settings:
                base:
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

          xcodegen generate

      - name: Build
        run: |
          set -e

          rm -rf build

          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find App
        run: |
          set -e

          APP=$(find build \
            -type d \
            -name "BoomMusic.app" \
            -print -quit)

          test -n "$APP"

          echo "$APP" > app_path.txt

          echo "=== APP PATH ==="
          echo "$APP"

          echo "=== EXECUTABLE ==="
          ls -lh "$APP/BoomMusic"

          file "$APP/BoomMusic"

      - name: Inject Web Content
        run: |
          set -e

          APP=$(cat app_path.txt)

          rm -rf "$APP/www"
          mkdir -p "$APP/www"

          cp -R BoomMusic/www/. "$APP/www/"

          echo "=== WWW ==="
          find "$APP/www" -type f -print

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"

      - name: Prepare Payload
        run: |
          set -e

          APP=$(cat app_path.txt)

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/BoomMusic.app

          echo "=== PAYLOAD ==="
          find Payload/BoomMusic.app -maxdepth 2 -type f -print

          echo "=== PAYLOAD EXECUTABLE ==="
          ls -lh Payload/BoomMusic.app/BoomMusic

          echo "=== PAYLOAD WWW ==="
          ls -lh Payload/BoomMusic.app/www/

          test -f Payload/BoomMusic.app/BoomMusic
          test -f Payload/BoomMusic.app/www/index.html
          test -f Payload/BoomMusic.app/www/Player.js

          echo "PAYLOAD OK"

      - name: Create IPA
        run: |
          set -e

          rm -f BoomMusic.ipa

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            BoomMusic.zip

          mv BoomMusic.zip BoomMusic.ipa

          echo "=== IPA ==="
          ls -lh BoomMusic.ipa

      - name: Verify IPA
        run: |
          set -e

          rm -rf ipa-check
          mkdir ipa-check

          unzip -q BoomMusic.ipa -d ipa-check

          echo "=== EXTRACTED ==="
          find ipa-check/Payload/BoomMusic.app -maxdepth 2 -type f -print

          echo "=== EXECUTABLE ==="
          ls -lh ipa-check/Payload/BoomMusic.app/BoomMusic

          echo "=== WEB ==="
          ls -lh ipa-check/Payload/BoomMusic.app/www/

          test -f ipa-check/Payload/BoomMusic.app/BoomMusic
          test -f ipa-check/Payload/BoomMusic.app/www/index.html
          test -f ipa-check/Payload/BoomMusic.app/www/Player.js

          echo ""
          echo "=============================="
          echo " BOOM MUSIC IPA READY"
          echo "=============================="

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
