name: Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Verify Files
        run: |
          set -e

          test -f BoomMusic/AppDelegate.swift
          test -f BoomMusic/SceneDelegate.swift
          test -f BoomMusic/ViewController.swift
          test -f BoomMusic/AudioManager.swift
          test -f BoomMusic/Info.plist

          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js
          test -f BoomMusic/www/Equalizer.js
          test -f BoomMusic/www/Visualizer.js

          echo "SOURCE OK"

      - name: Generate Xcode Project
        run: |
          set -e

          rm -rf Generated
          mkdir Generated

          cat > Generated/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              PRODUCT_NAME: BoomMusic
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: ../BoomMusic/Info.plist
              GENERATE_INFOPLIST_FILE: NO

          targets:

            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: ../BoomMusic/AppDelegate.swift
                - path: ../BoomMusic/SceneDelegate.swift
                - path: ../BoomMusic/ViewController.swift
                - path: ../BoomMusic/AudioManager.swift

              resources:
                - path: ../BoomMusic/www

              settings:
                base:
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

          cd Generated

          xcodegen generate

          echo "=== GENERATED PROJECT ==="

          ls -la
          test -f BoomMusic.xcodeproj/project.pbxproj

      - name: Build
        run: |
          set -e

          rm -rf build

          xcodebuild \
            -project Generated/BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Locate App
        run: |
          set -e

          APP=$(find build \
            -type d \
            -name "BoomMusic.app" \
            -print -quit)

          test -n "$APP"

          echo "$APP" > app_path.txt

          echo "=== APP ==="
          echo "$APP"

          echo "=== EXECUTABLE ==="
          file "$APP/BoomMusic"

          ls -lh "$APP/BoomMusic"

      - name: Verify Web
        run: |
          set -e

          APP=$(cat app_path.txt)

          echo "=== WEB ==="

          find "$APP/www" -type f -print

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"
          test -f "$APP/www/Equalizer.js"
          test -f "$APP/www/Visualizer.js"

          echo "WEB OK"

      - name: Create Payload
        run: |
          set -e

          APP=$(cat app_path.txt)

          rm -rf Payload

          mkdir Payload

          cp -R "$APP" Payload/B
