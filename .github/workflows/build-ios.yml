name: Boom Music - Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. CHECK REPOSITORY
      # =========================================================

      - name: Inspect Repository
        run: |
          set -e

          echo "=== REPOSITORY ==="
          find BoomMusic -maxdepth 3 -type f | sort

          echo ""
          echo "=== WEB FILES ==="

          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js

          find BoomMusic/www -type f | sort

          echo ""
          echo "SOURCE OK"


      # =========================================================
      # 3. CREATE XCODE PROJECT
      # =========================================================

      - name: Create Xcode Project
        run: |
          set -e

          mkdir -p BoomMusic.xcodeproj

          python3 <<'PY'
          import uuid
          import pathlib

          def uid():
              return uuid.uuid4().hex[:24].upper()

          project = uid()
          target = uid()
          sources_group = uid()
          products_group = uid()
          main_group = uid()
          build_config_list_project = uid()
          build_config_list_target = uid()

          debug_project = uid()
          release_project = uid()
          debug_target = uid()
          release_target = uid()

          files = [
              ("AppDelegate.swift", uid(), uid()),
              ("SceneDelegate.swift", uid(), uid()),
              ("ViewController.swift", uid(), uid()),
              ("AudioManager.swift", uid(), uid()),
          ]

          file_refs = []
          build_files = []

          for name, fr, bf in files:
              file_refs.append(
                  f'{fr} /* {name} */ = {{isa = PBXFileReference; '
                  f'fileEncoding = 4; lastKnownFileType = sourcecode.swift; '
                  f'path = "{name}"; sourceTree = "<group>"; }};'
              )

              build_files.append(
                  f'{bf} /* {name} in Sources */ = {{isa = PBXBuildFile; '
                  f'fileRef = {fr} /* {name} */; }};'
              )

          swift_refs = "\n".join(file_refs)
          swift_build = "\n".join(build_files)

          swift_group_children = "\n".join(
              f'\t\t\t\t{fr} /* {name} */,'
              for name, fr, bf in files
          )

          swift_sources = "\n".join(
              f'\t\t\t\t{bf} /* {name} in Sources */,'
              for name, fr, bf in files
          )

          pbx = f'''// !$*UTF8*$!
          {{
           archiveVersion = 1;
           classes = {{
           }};
           objectVersion = 56;
           objects = {{

          /* Begin PBXBuildFile section */

          {swift_build}

          /* End PBXBuildFile section */

          /* Begin PBXFileReference section */

          {swift_refs}

          {uid()} /* Info.plist */ = {{isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = "BoomMusic/Info.plist"; sourceTree = "<group>"; }};

          {uid()} /* BoomMusic.app */ = {{isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = BoomMusic.app; sourceTree = BUILT_PRODUCTS_DIR; }};

          /* End PBXFileReference section */

          /* Begin PBXFrameworksBuildPhase section */

          {uid()} /* Frameworks */ = {{
              isa = PBXFrameworksBuildPhase;
              buildActionMask = 2147483647;
              files = (
              );
              runOnlyForDeploymentPostprocessing = 0;
          }};

          /* End PBXFrameworksBuildPhase section */

          /* Begin PBXNativeTarget section */

          {target} /* BoomMusic */ = {{
              isa = PBXNativeTarget;
              buildConfigurationList = {build_config_list_target};
              buildPhases = (
                  {uid()},
                  {uid()},
                  {uid()},
              );
              buildRules = (
              );
              dependencies = (
              );
              name = BoomMusic;
              productName = BoomMusic;
              productReference = {uid()} /* BoomMusic.app */;
              productType = "com.apple.product-type.application";
          }};

          /* End PBXNativeTarget section */

          /* Begin PBXProject section */

          {project} /* Project object */ = {{
              isa = PBXProject;
              attributes = {{
                  LastUpgradeCheck = 1600;
                  TargetAttributes = {{
                      {target} = {{
                          CreatedOnToolsVersion = 16.0;
                      }};
                  }};
              }};
              buildConfigurationList = {build_config_list_project};
              compatibilityVersion = "Xcode 3.2";
              developmentRegion = en;
              hasScannedForEncodings = 0;
              knownRegions = (
                  en,
                  Base,
              );
              mainGroup = {main_group};
              productRefGroup = {products_group};
              projectDirPath = "";
              projectRoot = "";
              targets = (
                  {target},
              );
          }};

          /* End PBXProject section */

          /* Begin PBXResourcesBuildPhase section */

          {uid()} /* Resources */ = {{
              isa = PBXResourcesBuildPhase;
              buildActionMask = 2147483647;
              files = (
              );
              runOnlyForDeploymentPostprocessing = 0;
          }};

          /* End PBXResourcesBuildPhase section */

          /* Begin PBXSourcesBuildPhase section */

          {uid()} /* Sources */ = {{
              isa = PBXSourcesBuildPhase;
              buildActionMask = 2147483647;
              files = (
          {swift_sources}
              );
              runOnlyForDeploymentPostprocessing = 0;
          }};

          /* End PBXSourcesBuildPhase section */

          /* Begin PBXGroup section */

          {main_group} = {{
              isa = PBXGroup;
              children = (
                  {sources_group},
                  {products_group},
              );
              sourceTree = "<group>";
          }};

          {sources_group} = {{
              isa = PBXGroup;
              children = (
          {swift_group_children}
              );
              path = BoomMusic;
              sourceTree = "<group>";
          }};

          {products_group} = {{
              isa = PBXGroup;
              children = (
              );
              name = Products;
              sourceTree = "<group>";
          }};

          /* End PBXGroup section */

          /* Begin XCBuildConfiguration section */

          {debug_project} /* Debug */ = {{
              isa = XCBuildConfiguration;
              buildSettings = {{
                  ALWAYS_SEARCH_USER_PATHS = NO;
                  CLANG_ENABLE_MODULES = YES;
                  CODE_SIGNING_ALLOWED = NO;
                  CODE_SIGNING_REQUIRED = NO;
                  IPHONEOS_DEPLOYMENT_TARGET = 15.0;
                  SDKROOT = iphoneos;
              }};
              name = Debug;
          }};

          {release_project} /* Release */ = {{
              isa = XCBuildConfiguration;
              buildSettings = {{
                  ALWAYS_SEARCH_USER_PATHS = NO;
                  CLANG_ENABLE_MODULES = YES;
                  CODE_SIGNING_ALLOWED = NO;
                  CODE_SIGNING_REQUIRED = NO;
                  IPHONEOS_DEPLOYMENT_TARGET = 15.0;
                  SDKROOT = iphoneos;
              }};
              name = Release;
          }};

          {debug_target} /* Debug */ = {{
              isa = XCBuildConfiguration;
              buildSettings = {{
                  PRODUCT_BUNDLE_IDENTIFIER = com.boommusic.app;
                  PRODUCT_NAME = BoomMusic;
                  INFOPLIST_FILE = BoomMusic/Info.plist;
                  SWIFT_VERSION = 5.0;
                  TARGETED_DEVICE_FAMILY = "1,2";
                  CODE_SIGNING_ALLOWED = NO;
                  CODE_SIGNING_REQUIRED = NO;
              }};
              name = Debug;
          }};

          {release_target} /* Release */ = {{
              isa = XCBuildConfiguration;
              buildSettings = {{
                  PRODUCT_BUNDLE_IDENTIFIER = com.boommusic.app;
                  PRODUCT_NAME = BoomMusic;
                  INFOPLIST_FILE = BoomMusic/Info.plist;
                  SWIFT_VERSION = 5.0;
                  TARGETED_DEVICE_FAMILY = "1,2";
                  CODE_SIGNING_ALLOWED = NO;
                  CODE_SIGNING_REQUIRED = NO;
              }};
              name = Release;
          }};

          /* End XCBuildConfiguration section */

          /* Begin XCConfigurationList section */

          {build_config_list_project} /* Build configuration list for PBXProject */ = {{
              isa = XCConfigurationList;
              buildConfigurations = (
                  {debug_project},
                  {release_project},
              );
              defaultConfigurationIsVisible = 0;
              defaultConfigurationName = Release;
          }};

          {build_config_list_target} /* Build configuration list for PBXNativeTarget */ = {{
              isa = XCConfigurationList;
              buildConfigurations = (
                  {debug_target},
                  {release_target},
              );
              defaultConfigurationIsVisible = 0;
              defaultConfigurationName = Release;
          }};

          /* End XCConfigurationList section */

           }};
           rootObject = {project} /* Project object */;
          }}
          '''

          pathlib.Path(
              "BoomMusic.xcodeproj/project.pbxproj"
          ).write_text(pbx)

          print("Xcode project created")
          PY


      # =========================================================
      # 4. BUILD
      # =========================================================

      - name: Build iPhoneOS
        run: |
          set -e

          xcodebuild \
            -project BoomMusic.xcodeproj \
            -target BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build-output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build


      # =========================================================
      # 5. CHECK APP
      # =========================================================

      - name: Verify Compiled App
        run: |
          set -e

          APP="build-output/BoomMusic.app"

          test -d "$APP"

          echo "=== APP SIZE ==="
          du -sh "$APP"

          echo "=== EXECUTABLE ==="
          ls -lh "$APP/BoomMusic"

          file "$APP/BoomMusic"

          echo "=== APP CONTENT ==="
          find "$APP" -maxdepth 2 -type f | sort


      # =========================================================
      # 6. COPY WEB CONTENT
      # =========================================================

      - name: Add Web App
        run: |
          set -e

          APP="build-output/BoomMusic.app"

          mkdir -p "$APP/www"

          cp -R BoomMusic/www/. "$APP/www/"

          echo "=== WWW ==="
          du -sh "$APP/www"

          find "$APP/www" -type f | sort

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"


      # =========================================================
      # 7. CREATE IPA
      # =========================================================

      - name: Package IPA
        run: |
          set -e

          rm -rf Payload BoomMusic.ipa

          mkdir Payload

          cp -R \
            build-output/BoomMusic.app \
            Payload/BoomMusic.app

          cd Payload

          zip -qry ../BoomMusic.ipa BoomMusic.app

          cd ..

          echo "=== FINAL IPA ==="
          ls -lh BoomMusic.ipa

          echo "=== APP SIZE ==="
          du -sh Payload/BoomMusic.app


      # =========================================================
      # 8. VERIFY IPA
      # =========================================================

      - name: Verify IPA
        run: |
          set -e

          echo "=== IPA CONTENT ==="

          unzip -l BoomMusic.ipa

          echo "=== EXECUTABLE ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/BoomMusic"

          echo "=== INDEX ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/www/index.html"

          echo "=== PLAYER ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/www/Player.js"

          echo "=== IPA OK ==="


      # =========================================================
      # 9. UPLOAD
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
