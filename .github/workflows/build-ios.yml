name: Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Repository
        run: |
          set -e

          test -f BoomMusic.xcodeproj/project.pbxproj

          test -f BoomMusic/AppDelegate.swift
          test -f BoomMusic/SceneDelegate.swift
          test -f BoomMusic/ViewController.swift
          test -f BoomMusic/AudioManager.swift
          test -f BoomMusic/Info.plist

          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js
          test -f BoomMusic/www/Equalizer.js
          test -f BoomMusic/www/Visualizer.js

          echo "REPOSITORY OK"

      - name: Fix Project Paths
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("BoomMusic.xcodeproj/project.pbxproj")
          s = p.read_text()

          replacements = {
              "path = AppDelegate.swift;":
                  "path = BoomMusic/AppDelegate.swift;",

              "path = SceneDelegate.swift;":
                  "path = BoomMusic/SceneDelegate.swift;",

              "path = ViewController.swift;":
                  "path = BoomMusic/ViewController.swift;",

              "path = AudioManager.swift;":
                  "path = BoomMusic/AudioManager.swift;",

              "path = www;":
                  "path = BoomMusic/www;",

              "INFOPLIST_FILE = Info.plist;":
                  "INFOPLIST_FILE = BoomMusic/Info.plist;",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

          echo "PROJECT PATHS OK"

      - name: Show Project
        run: |
          xcodebuild \
            -project BoomMusic.xcodeproj \
            -list

      - name: Build iPhoneOS
        run: |
          set -e

          rm -rf build

          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Locate App
        run: |
          set -e

          APP=$(find build \
            -type d \
            -name "BoomMusic.app" \
            -print -quit)

          test -n "$APP"

          echo "$APP" > app_path.txt

          echo "=== APP ==="
          echo "$APP"

          echo "=== SIZE ==="
          du -sh "$APP"

          echo "=== EXECUTABLE ==="
          ls -lh "$APP/BoomMusic"

          file "$APP/BoomMusic"

      - name: Ensure Web Content
        run: |
          set -e

          APP=$(cat app_path.txt)

          rm -rf "$APP/www"
          mkdir -p "$APP/www"

          cp -R BoomMusic/www/. "$APP/www/"

          echo "=== WWW ==="
          find "$APP/www" -type f -print

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"
          test -f "$APP/www/Equalizer.js"
          test -f "$APP/www/Visualizer.js"

          echo "WEB CONTENT OK"

      - name: Prepare Payload
        run: |
          set -e

          APP=$(cat app_path.txt)

          rm -rf Payload

          mkdir -p Payload

          cp -R "$APP" Payload/BoomMusic.app

          test -f Payload/BoomMusic.app/BoomMusic
          test -f Payload/BoomMusic.app/www/index.html
          test -f Payload/BoomMusic.app/www/Player.js

          echo "=== PAYLOAD SIZE ==="
          du -sh Payload/BoomMusic.app

          echo "=== PAYLOAD ==="
          find Payload/BoomMusic.app \
            -maxdepth 2 \
            -type f \
            -print

      - name: Create IPA
        run: |
          set -e

          rm -f BoomMusic.ipa

          cd Payload

          zip -qry ../BoomMusic.ipa BoomMusic.app

          cd ..

          echo "=== IPA ==="
          ls -lh BoomMusic.ipa

      - name: Verify IPA
        run: |
          set -e

          rm -rf verify
          mkdir verify

          unzip -q BoomMusic.ipa -d verify

          APP="verify/Payload/BoomMusic.app"

          test -f "$APP/BoomMusic"
          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"
          test -f "$APP/www/Equalizer.js"
          test -f "$APP/www/Visualizer.js"

          echo "=== FINAL APP ==="
          du -sh "$APP"

          echo "=== EXECUTABLE ==="
          file "$APP/BoomMusic"

          echo "=== WEB ==="
          find "$APP/www" -type f -print

          echo ""
          echo "=============================="
          echo " BOOM MUSIC IPA READY"
          echo "=============================="

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
