name: Build Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Source Files
        run: |
          test -f BoomMusic/AppDelegate.swift
          test -f BoomMusic/SceneDelegate.swift
          test -f BoomMusic/ViewController.swift
          test -f BoomMusic/AudioManager.swift
          test -f BoomMusic/Info.plist
          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js
          test -f BoomMusic/www/Equalizer.js
          test -f BoomMusic/www/Visualizer.js

      - name: Create Xcode Project
        run: |
          mkdir -p Build

          cat > Build/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: ../BoomMusic/Info.plist
              GENERATE_INFOPLIST_FILE: NO

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: ../BoomMusic/AppDelegate.swift
                - path: ../BoomMusic/SceneDelegate.swift
                - path: ../BoomMusic/ViewController.swift
                - path: ../BoomMusic/AudioManager.swift

              settings:
                base:
                  PRODUCT_NAME: BoomMusic
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

      - name: Generate Xcode Project
        working-directory: Build
        run: xcodegen generate

      - name: Archive
        working-directory: Build
        run: |
          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/BoomMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Copy Web App Into Bundle
        run: |
          APP="BoomMusic.xcarchive/Products/Applications/BoomMusic.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: BoomMusic.app tidak ditemukan"
            exit 1
          fi

          echo "Copying www..."

          rm -rf "$APP/www"
          cp -R BoomMusic/www "$APP/www"

          echo "=== WEB FILES ==="
          find "$APP/www" -type f | sort

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"
          test -f "$APP/www/Equalizer.js"
          test -f "$APP/www/Visualizer.js"

      - name: Create IPA
        run: |
          APP="BoomMusic.xcarchive/Products/Applications/BoomMusic.app"

          rm -rf Payload BoomMusic.ipa
          mkdir -p Payload

          cp -R "$APP" Payload/BoomMusic.app

          echo "=== APP SIZE ==="
          du -sh Payload/BoomMusic.app

          echo "=== CREATE IPA ==="
          zip -qry BoomMusic.ipa Payload

          echo "=== IPA RESULT ==="
          ls -lh BoomMusic.ipa

      - name: Verify IPA
        run: |
          unzip -l BoomMusic.ipa | grep "Payload/BoomMusic.app/www/"
          unzip -l BoomMusic.ipa | grep "Payload/BoomMusic.app/www/index.html"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
