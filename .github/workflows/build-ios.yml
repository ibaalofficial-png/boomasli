name: Build Boom Music iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show files
        run: |
          echo "=== REPOSITORY ==="
          find . -maxdepth 4 -type f | sort

      - name: Create Xcode project
        run: |
          mkdir -p Build/BoomMusic.xcodeproj

          cat > Build/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              SWIFT_VERSION: 5.0
              INFOPLIST_FILE: BoomMusic/Info.plist
              TARGETED_DEVICE_FAMILY: "1,2"

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: BoomMusic

              resources:
                - path: BoomMusic/www

              settings:
                base:
                  PRODUCT_NAME: BoomMusic
          EOF

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        working-directory: Build
        run: |
          xcodegen generate

      - name: Check generated project
        run: |
          find Build -maxdepth 3 -type f | sort

      - name: Build iOS Simulator
        working-directory: Build
        run: |
          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package simulator app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*/Build/Products/Release-iphonesimulator/BoomMusic.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "BoomMusic.app tidak ditemukan"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/BoomMusic.app

          zip -r BoomMusic-Simulator.zip Payload

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-Simulator
          path: BoomMusic-Simulator.zip
