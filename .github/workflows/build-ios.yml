name: Build Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Xcode Project
        run: |
          mkdir -p Build

          cat > Build/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: ../BoomMusic/Info.plist

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: ../BoomMusic/AppDelegate.swift
                - path: ../BoomMusic/SceneDelegate.swift
                - path: ../BoomMusic/ViewController.swift
                - path: ../BoomMusic/AudioManager.swift

              resources:
                - path: ../BoomMusic/www

              settings:
                base:
                  PRODUCT_NAME: BoomMusic
                  GENERATE_INFOPLIST_FILE: NO
          EOF

      - name: Generate Xcode Project
        working-directory: Build
        run: xcodegen generate

      - name: Archive
        working-directory: Build
        run: |
          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/BoomMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create IPA
        run: |
          APP_PATH="BoomMusic.xcarchive/Products/Applications/BoomMusic.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "BoomMusic.app tidak ditemukan"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/BoomMusic.app

          zip -r BoomMusic.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
