      - name: Create IPA
        run: |
          set -e

          rm -rf IPA_PACKAGE
          rm -f BoomMusic.ipa

          mkdir -p IPA_PACKAGE/Payload

          cp -R \
            Payload/BoomMusic.app \
            IPA_PACKAGE/Payload/BoomMusic.app

          echo "=== IPA PACKAGE ==="

          find IPA_PACKAGE/Payload/BoomMusic.app \
            -maxdepth 2 \
            -type f \
            -print

          test -f IPA_PACKAGE/Payload/BoomMusic.app/BoomMusic
          test -f IPA_PACKAGE/Payload/BoomMusic.app/www/index.html

          cd IPA_PACKAGE

          zip -qry ../BoomMusic.ipa Payload

          cd ..

          echo "=== IPA ==="
          ls -lh BoomMusic.ipa

      - name: Verify IPA
        run: |
          set -e

          rm -rf verify

          mkdir verify

          unzip -q BoomMusic.ipa -d verify

          echo "=== EXTRACTED IPA ==="

          find verify -maxdepth 3 -type f -print

          APP="verify/Payload/BoomMusic.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Payload/BoomMusic.app tidak ditemukan"
            exit 1
          fi

          echo "=== FINAL APP ==="
          du -sh "$APP"

          echo "=== EXECUTABLE ==="

          file "$APP/BoomMusic"

          test -f "$APP/BoomMusic"

          echo "=== WEB ==="

          find "$APP/www" -type f -print

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"
          test -f "$APP/www/Equalizer.js"
          test -f "$APP/www/Visualizer.js"

          echo ""
          echo "=============================="
          echo " BOOM MUSIC IPA READY"
          echo "=============================="

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
