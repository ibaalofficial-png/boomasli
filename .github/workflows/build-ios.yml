name: Build Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Verify Web Files
        run: |
          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js
          test -f BoomMusic/www/Equalizer.js
          test -f BoomMusic/www/Visualizer.js

          echo "Web files OK:"
          find BoomMusic/www -type f | sort

      - name: Create Xcode Project
        run: |
          mkdir -p Build

          cat > Build/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: ../BoomMusic/Info.plist
              GENERATE_INFOPLIST_FILE: NO

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: ../BoomMusic/AppDelegate.swift
                - path: ../BoomMusic/SceneDelegate.swift
                - path: ../BoomMusic/ViewController.swift
                - path: ../BoomMusic/AudioManager.swift

              resources:
                - path: ../BoomMusic/www

              settings:
                base:
                  PRODUCT_NAME: BoomMusic
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

      - name: Generate Xcode Project
        working-directory: Build
        run: |
          xcodegen generate

      - name: Show Project
        run: |
          find Build -maxdepth 3 -type f | sort

      - name: Archive for iPhone
        working-directory: Build
        run: |
          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/BoomMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify Archive
        run: |
          APP="BoomMusic.xcarchive/Products/Applications/BoomMusic.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: BoomMusic.app tidak ditemukan"
            find BoomMusic.xcarchive -maxdepth 6 -print
            exit 1
          fi

          echo "=== APP SIZE ==="
          du -sh "$APP"

          echo "=== APP CONTENT ==="
          find "$APP" -maxdepth 3 -type f | sort

          echo "=== WEB CONTENT ==="
          find "$APP/www" -type f | sort

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"

      - name: Create IPA
        run: |
          rm -rf Payload BoomMusic.ipa

          mkdir -p Payload

          cp -R \
            "BoomMusic.xcarchive/Products/Applications/BoomMusic.app" \
            "Payload/BoomMusic.app"

          echo "=== PAYLOAD ==="
          du -sh Payload/BoomMusic.app

          echo "=== PAYLOAD WEB ==="
          find Payload/BoomMusic.app/www -type f | sort

          zip -qry BoomMusic.ipa Payload

          echo "=== IPA SIZE ==="
          ls -lh BoomMusic.ipa

      - name: Verify IPA
        run: |
          unzip -l BoomMusic.ipa | head -100

          unzip -l BoomMusic.ipa | grep "Payload/BoomMusic.app/www/index.html"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
