name: Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Source
        run: |
          set -e

          test -f BoomMusic/AppDelegate.swift
          test -f BoomMusic/SceneDelegate.swift
          test -f BoomMusic/ViewController.swift
          test -f BoomMusic/AudioManager.swift

          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js

          echo "SOURCE OK"

      - name: Create Project Specification
        run: |
          cat > project.yml <<'EOF'
          name: BoomMusic

          options:
            minimumXcodeGenVersion: 2.38.0
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              PRODUCT_NAME: BoomMusic
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: BoomMusic/Info.plist
              GENERATE_INFOPLIST_FILE: NO

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: BoomMusic/AppDelegate.swift
                - path: BoomMusic/SceneDelegate.swift
                - path: BoomMusic/ViewController.swift
                - path: BoomMusic/AudioManager.swift

              settings:
                base:
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build iPhoneOS
        run: |
          set -e

          rm -rf build

          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate App
        run: |
          set -e

          APP=$(find build \
            -type d \
            -name "BoomMusic.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: BoomMusic.app tidak ditemukan"
            exit 1
          fi

          echo "$APP" > app_path.txt

          echo "=== APP ==="
          echo "$APP"

          echo "=== SIZE ==="
          du -sh "$APP"

          echo "=== EXECUTABLE ==="
          ls -lh "$APP/BoomMusic"

          file "$APP/BoomMusic"

      - name: Inject Web App
        run: |
          set -e

          APP=$(cat app_path.txt)

          echo "=== COPYING WWW ==="

          rm -rf "$APP/www"

          mkdir -p "$APP/www"

          cp -R BoomMusic/www/. "$APP/www/"

          echo "=== WWW CONTENT ==="

          find "$APP/www" -type f -print

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"

          echo "WWW OK"

      - name: Create IPA
        run: |
          set -e

          APP=$(cat app_path.txt)

          rm -rf Payload BoomMusic.ipa

          mkdir Payload

          cp -R "$APP" Payload/BoomMusic.app

          echo "=== FINAL APP SIZE ==="
          du -sh Payload/BoomMusic.app

          echo "=== CREATE IPA ==="

          cd Payload

          zip -qry ../BoomMusic.ipa BoomMusic.app

          cd ..

          echo "=== FINAL IPA ==="
          ls -lh BoomMusic.ipa

      - name: Verify IPA
        run: |
          set -e

          echo "=== CHECK EXECUTABLE ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/BoomMusic"

          echo "=== CHECK INDEX ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/www/index.html"

          echo "=== CHECK PLAYER ==="

          unzip -l BoomMusic.ipa \
            | grep "Payload/BoomMusic.app/www/Player.js"

          echo ""
          echo "=========================="
          echo " BOOM MUSIC IPA READY"
          echo "=========================="

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
