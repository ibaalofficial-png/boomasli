name: Build Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Project
        run: |
          mkdir -p Build

          cat > Build/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              PRODUCT_NAME: BoomMusic
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: ../BoomMusic/Info.plist
              GENERATE_INFOPLIST_FILE: NO

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: ../BoomMusic/AppDelegate.swift
                - path: ../BoomMusic/SceneDelegate.swift
                - path: ../BoomMusic/ViewController.swift
                - path: ../BoomMusic/AudioManager.swift

              settings:
                base:
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

          cd Build
          xcodegen generate

      - name: Archive
        run: |
          xcodebuild \
            -project Build/BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/BoomMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Locate App
        run: |
          set -e

          echo "=== FIND APP ==="

          find BoomMusic.xcarchive \
            -type d \
            -name "*.app" \
            -print

          APP=$(find BoomMusic.xcarchive \
            -type d \
            -name "BoomMusic.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: BoomMusic.app tidak ditemukan"
            exit 1
          fi

          echo "APP=$APP"

          echo "$APP" > app_path.txt

          echo "=== APP SIZE ==="
          du -sh "$APP"

          echo "=== APP CONTENT ==="
          find "$APP" -maxdepth 2 -type f -print

      - name: Inject Web Files
        run: |
          set -e

          APP=$(cat app_path.txt)

          echo "=== COPYING WWW ==="

          rm -rf "$APP/www"
          mkdir -p "$APP/www"

          cp -R BoomMusic/www/. "$APP/www/"

          test -f "$APP/www/index.html"
          test -f "$APP/www/Player.js"

          echo "=== WWW SIZE ==="
          du -sh "$APP/www"

      - name: Verify App Binary
        run: |
          set -e

          APP=$(cat app_path.txt)

          echo "=== APP EXECUTABLE ==="

          EXECUTABLE="$APP/BoomMusic"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: BoomMusic executable tidak ditemukan"

            echo "Files:"
            find "$APP" -maxdepth 2 -type f -print

            exit 1
          fi

          ls -lh "$EXECUTABLE"
          file "$EXECUTABLE"

      - name: Create IPA
        run: |
          set -e

          APP=$(cat app_path.txt)

          rm -rf Payload BoomMusic.ipa
          mkdir -p Payload

          cp -R "$APP" Payload/BoomMusic.app

          echo "=== PAYLOAD ==="
          find Payload/BoomMusic.app -maxdepth 2 -type f -print

          echo "=== PAYLOAD SIZE ==="
          du -sh Payload/BoomMusic.app

          echo "=== CREATE IPA ==="

          cd Payload

          zip -qry ../BoomMusic.ipa BoomMusic.app

          cd ..

          echo "=== IPA ==="
          ls -lh BoomMusic.ipa

      - name: Verify IPA
        run: |
          set -e

          echo "=== IPA CONTENT ==="

          unzip -l BoomMusic.ipa

          echo "=== VERIFY EXECUTABLE ==="

          unzip -l BoomMusic.ipa \
            | grep "BoomMusic.app/BoomMusic"

          echo "=== VERIFY INDEX ==="

          unzip -l BoomMusic.ipa \
            | grep "BoomMusic.app/www/index.html"

          echo "=== VERIFY PLAYER ==="

          unzip -l BoomMusic.ipa \
            | grep "BoomMusic.app/www/Player.js"

          echo "=== VERIFY EQUALIZER ==="

          unzip -l BoomMusic.ipa \
            | grep "BoomMusic.app/www/Equalizer.js"

          echo "=== VERIFY VISUALIZER ==="

          unzip -l BoomMusic.ipa \
            | grep "BoomMusic.app/www/Visualizer.js"

          echo "=============================="
          echo " BOOM MUSIC IPA READY"
          echo "=============================="

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
