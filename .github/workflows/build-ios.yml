name: Build Boom Music iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project Files
        run: |
          echo "=== BoomMusic ==="
          find BoomMusic -maxdepth 3 -type f | sort

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Create Xcode Project
        run: |
          mkdir -p Build

          cat > Build/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: ../BoomMusic/Info.plist

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: ../BoomMusic/AppDelegate.swift
                - path: ../BoomMusic/SceneDelegate.swift
                - path: ../BoomMusic/ViewController.swift
                - path: ../BoomMusic/AudioManager.swift

              resources:
                - path: ../BoomMusic/www

              settings:
                base:
                  PRODUCT_NAME: BoomMusic
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

      - name: Generate Xcode Project
        working-directory: Build
        run: |
          xcodegen generate

      - name: Verify Xcode Project
        run: |
          echo "=== Generated Project ==="
          find Build -maxdepth 3 -type f | sort

      - name: Build for iOS Simulator
        working-directory: Build
        run: |
          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find Built App
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -path "*/Build/Products/Release-iphonesimulator/BoomMusic.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: BoomMusic.app tidak ditemukan"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package App
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/BoomMusic.app

          zip -r BoomMusic-Simulator.zip Payload

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-Simulator
          path: BoomMusic-Simulator.zip
