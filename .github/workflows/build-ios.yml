name: Build Boom Music IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Files
        run: |
          test -f BoomMusic/AppDelegate.swift
          test -f BoomMusic/SceneDelegate.swift
          test -f BoomMusic/ViewController.swift
          test -f BoomMusic/AudioManager.swift
          test -f BoomMusic/Info.plist
          test -f BoomMusic/www/index.html
          test -f BoomMusic/www/Player.js
          test -f BoomMusic/www/Equalizer.js
          test -f BoomMusic/www/Visualizer.js

      - name: Create Xcode Project
        run: |
          mkdir -p Build

          cat > Build/project.yml <<'EOF'
          name: BoomMusic

          options:
            deploymentTarget:
              iOS: "15.0"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.boommusic.app
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              INFOPLIST_FILE: ../BoomMusic/Info.plist
              GENERATE_INFOPLIST_FILE: NO

          targets:
            BoomMusic:
              type: application
              platform: iOS

              sources:
                - path: ../BoomMusic/AppDelegate.swift
                - path: ../BoomMusic/SceneDelegate.swift
                - path: ../BoomMusic/ViewController.swift
                - path: ../BoomMusic/AudioManager.swift

              resources:
                - path: ../BoomMusic/www
                  type: folder

              settings:
                base:
                  PRODUCT_NAME: BoomMusic
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
          EOF

      - name: Generate Project
        working-directory: Build
        run: |
          xcodegen generate

      - name: Archive
        working-directory: Build
        run: |
          xcodebuild \
            -project BoomMusic.xcodeproj \
            -scheme BoomMusic \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/BoomMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify Web Resources
        run: |
          APP="BoomMusic.xcarchive/Products/Applications/BoomMusic.app"

          echo "=== APP SIZE ==="
          du -sh "$APP"

          echo "=== APP CONTENT ==="
          find "$APP" -maxdepth 3 -type f | sort

          echo "=== SEARCH WWW ==="
          find "$APP" -type f \( \
            -name "index.html" -o \
            -name "Player.js" -o \
            -name "Equalizer.js" -o \
            -name "Visualizer.js" \
          \) -print

      - name: Prepare IPA
        run: |
          APP="BoomMusic.xcarchive/Products/Applications/BoomMusic.app"

          rm -rf Payload BoomMusic.ipa
          mkdir Payload

          cp -R "$APP" Payload/BoomMusic.app

          if [ ! -f "Payload/BoomMusic.app/www/index.html" ]; then
            echo "ERROR: www tidak masuk ke aplikasi"
            exit 1
          fi

          zip -qry BoomMusic.ipa Payload

          echo "=== FINAL IPA ==="
          ls -lh BoomMusic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic.ipa
          if-no-files-found: error
